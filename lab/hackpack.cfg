// Source cheats start off. F10 resets the overlay at any time.
// A persistent clip binary patch requires patch_clip.py --undo and a restart.
hp_off
hp_hud 1
bind F5 hp_toggle_esp
bind F6 hp_toggle_radar
bind F7 hp_toggle_aim
bind F8 hp_toggle_bhop
bind F9 hp_speed_cycle
bind F10 hp_off
bind F11 hp_status
echo "Hack Pack: F5 ESP | F6 radar | F7 aim | F8 bhop | F9 speed | F10 off"
