hostname "The Hack Pack | cs.mahaloz.re"
sv_lan 0
sv_password ""
rcon_password ""
sv_cheats 0
// Hack Pack speed lab: permit accelerated command time and bunny hopping.
sv_speedhack_kick 0
hp_validate_cmdtime 0
sv_enablebunnyhopping 1
// Students implement their own jump timing; holding jump alone stays vanilla.
sv_autobunnyhopping 0
// Ammo stays authoritative for the deliberately unsuccessful memory edit.
mp_infinite_ammo 0
// Optional oversharing demonstration; stock PVS behavior is the default.
hp_full_visibility 0
hp_test_mode 0
sv_allowdownload 1
sv_allowupload 0
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_freezetime 3
mp_roundtime 3
mp_timelimit 30
mp_startmoney 800
// Explicit defaults make exec server.cfg undo the optional practice rules.
mp_round_infinite 0
mp_forcerespawn 0
mp_roundrespawn_time 20
mp_autokick 1
mp_buytime 1.5
sv_timeout 60
log on
