name: counter-strike
services:
  server:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-27015}:27015/udp"
    environment:
      MAP: ${MAP:-de_dust2}
      MAXPLAYERS: ${MAXPLAYERS:-32}
    volumes:
      - game-data:/data
      - ./server.cfg:/config/server.cfg:ro
      - ./game_init.cfg:/config/game_init.cfg:ro
      - ./BotProfile.db:/config/BotProfile.db:ro
      - ./classroom.cfg:/config/classroom.cfg:ro
      - ./protected.cfg:/config/protected.cfg:ro
      - ./mapcycle.txt:/config/mapcycle.txt:ro
    healthcheck:
      test: ["CMD", "python3", "/opt/probe.py", "127.0.0.1", "--query-only"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  game-data:
